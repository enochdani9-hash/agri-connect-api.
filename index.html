<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect | Direct Farm Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- HEADER -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">🌱 AgriConnect</h1>
            <nav class="space-x-4">
                <button onclick="switchTab('marketplace')" class="hover:underline font-medium">Marketplace</button>
                <button onclick="switchTab('farmer-portal')" class="bg-emerald-600 px-3 py-1.5 rounded-lg hover:bg-emerald-500 font-medium transition">Farmer Portal</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- MARKETPLACE TAB -->
        <section id="marketplace-tab">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h2 class="text-3xl font-extrabold text-slate-900">Fresh Harvest Market</h2>
                    <p class="text-slate-600">Connecting local farmers directly to urban buyers in Ghana.</p>
                </div>
                <!-- Category Filter -->
                <div>
                    <select id="category-filter" onchange="loadProducts()" class="bg-white border border-slate-300 rounded-lg px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="all">All Categories</option>
                        <option value="Vegetables">Vegetables</option>
                        <option value="Poultry">Poultry</option>
                        <option value="Tubers">Tubers</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic products load here -->
            </div>
        </section>

        <!-- FARMER PORTAL TAB -->
        <section id="farmer-tab" class="hidden max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Farmer Portal</h2>
            <p class="text-slate-600 mb-6">Log in to manage your harvest listings or post new produce.</p>
            
            <!-- Login Form -->
            <div id="login-form-container" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="login-email" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="farmer@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="••••••••">
                </div>
                <button onclick="loginFarmer()" class="w-full bg-emerald-700 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-800 transition">Log In</button>
                <p id="login-error" class="text-red-500 text-sm text-center"></p>
            </div>

            <!-- Farmer Dashboard (Hidden until logged in) -->
            <div id="farmer-dashboard" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <div>
                        <p class="text-xs text-emerald-600 font-semibold uppercase tracking-wider">Logged in as</p>
                        <p id="farmer-name-display" class="font-bold text-slate-900"></p>
                    </div>
                    <button onclick="logoutFarmer()" class="text-sm bg-white border border-slate-300 px-3 py-1 rounded-lg hover:bg-slate-100">Log Out</button>
                </div>

                <!-- Add Product Form -->
                <div class="border-t pt-4">
                    <h3 class="font-bold text-lg text-slate-900 mb-3">Post New Harvest</h3>
                    <div class="space-y-3">
                        <input type="text" id="prod-name" placeholder="Product Name (e.g. Fresh Tomatoes)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="prod-category" placeholder="Category (e.g. Vegetables)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <input type="text" id="prod-unit" placeholder="Unit (e.g. Crate)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="prod-price" placeholder="Price per unit (GH₵)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                            <input type="number" id="prod-qty" placeholder="Quantity Available" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        </div>
                        <button onclick="postProduct()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition">Publish Listing Live</button>
                    </div>
                </div>

                <!-- My Listings -->
                <div class="border-t pt-4">
                    <h3 class="font-bold text-lg text-slate-900 mb-3">Your Active Listings</h3>
                    <div id="my-listings-container" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Replace this with your actual live Render backend URL
        const API_URL = "https://agri-connect-api-2.onrender.com";
        let authToken = localStorage.getItem("farmer_token") || "";

        // Check login state on load
        if (authToken) {
            showFarmerDashboard();
        }

        function switchTab(tab) {
            if (tab === 'marketplace') {
                document.getElementById('marketplace-tab').classList.remove('hidden');
                document.getElementById('farmer-tab').classList.add('hidden');
                loadProducts();
            } else {
                document.getElementById('marketplace-tab').classList.add('hidden');
                document.getElementById('farmer-tab').classList.remove('hidden');
                if (authToken) loadMyListings();
            }
        }

        async function loadProducts() {
            const category = document.getElementById('category-filter').value;
            let url = `${API_URL}/api/v1/products`;
            if (category !== 'all') url += `?category=${category}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '';

                if (data.results.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">No farm listings available right now.</p>`;
                    return;
                }

                data.results.forEach(item => {
                    grid.innerHTML += `
                        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${item.category}</span>
                                    <span class="text-xs text-slate-500 font-medium">${item.region}</span>
                                </div>
                                <h3 class="text-xl font-bold text-slate-900 mb-1">${item.product_name}</h3>
                                <p class="text-sm text-slate-600 mb-4">Farmer: <span class="font-medium text-slate-900">${item.farmer_name}</span></p>
                            </div>
                            <div>
                                <div class="flex justify-between items-baseline mb-4">
                                    <span class="text-2xl font-extrabold text-emerald-700">GH₵ ${parseFloat(item.price_ghs).toFixed(2)}</span>
                                    <span class="text-sm text-slate-500">Stock: ${item.quantity_available} ${item.unit}s</span>
                                </div>
                                <button onclick="openOrderPrompt(${item.id}, '${item.product_name}', ${item.price_ghs}, ${item.quantity_available}, '${item.unit}')" class="w-full bg-emerald-700 text-white font-medium py-2 rounded-xl hover:bg-emerald-800 transition">Place Order</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Failed to load products:", err);
            }
        }

        async function loginFarmer() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.innerText = "";

            try {
                const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Login failed");

                authToken = data.access_token;
                localStorage.setItem("farmer_token", authToken);
                showFarmerDashboard();
            } catch (err) {
                errorEl.innerText = err.message;
            }
        }

        function showFarmerDashboard() {
            document.getElementById('login-form-container').classList.add('hidden');
            document.getElementById('farmer-dashboard').classList.remove('hidden');
            loadMyListings();
        }

        function logoutFarmer() {
            authToken = "";
            localStorage.removeItem("farmer_token");
            document.getElementById('farmer-dashboard').classList.add('hidden');
            document.getElementById('login-form-container').classList.remove('hidden');
        }

        async function loadMyListings() {
            try {
                const res = await fetch(`${API_URL}/api/v1/farmer/my-listings`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                document.getElementById('farmer-name-display').innerText = data.farmer || "Verified Farmer";
                
                const container = document.getElementById('my-listings-container');
                container.innerHTML = '';

                if (data.results.length === 0) {
                    container.innerHTML = `<p class="text-sm text-slate-500">You have no active listings yet.</p>`;
                    return;
                }

                data.results.forEach(item => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm">
                            <div>
                                <p class="font-bold text-slate-900">${item.product_name}</p>
                                <p class="text-xs text-slate-600">GH₵ ${item.price_ghs} • ${item.quantity_available} ${item.unit}s left</p>
                            </div>
                            <button onclick="deleteListing(${item.id})" class="text-red-600 hover:text-red-800 text-xs font-semibold px-2 py-1 bg-red-50 rounded border border-red-200">Delete</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading my listings:", err);
            }
        }

        async function postProduct() {
            const product_name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const unit = document.getElementById('prod-unit').value;
            const price_ghs = parseFloat(document.getElementById('prod-price').value);
            const quantity_available = parseInt(document.getElementById('prod-qty').value);

            if (!product_name || !category || !unit || isNaN(price_ghs) || isNaN(quantity_available)) {
                alert("Please fill in all product fields correctly.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/v1/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ product_name, category, unit, price_ghs, quantity_available })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Failed to post listing");

                alert("Harvest listed successfully!");
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-category').value = '';
                document.getElementById('prod-unit').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-qty').value = '';
                loadMyListings();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteListing(id) {
            if (!confirm("Are you sure you want to remove this listing?")) return;

            try {
                const res = await fetch(`${API_URL}/api/v1/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error("Failed to delete");
                loadMyListings();
            } catch (err) {
                alert(err.message);
            }
        }

        async function openOrderPrompt(itemId, productName, price, maxStock, unit) {
            const buyer_name = prompt(`Enter your name for ordering ${product_name}:`);
            if (!buyer_name) return;
            const buyer_phone = prompt(`Enter your phone number (e.g. 024XXXXXXX):`);
            if (!buyer_phone) return;
            const qtyStr = prompt(`Enter quantity needed (Available: ${maxStock} ${unit}s):`);
            const quantity_ordered = parseInt(qtyStr);
            if (isNaN(quantity_ordered) || quantity_ordered <= 0) {
                alert("Invalid quantity.");
                return;
            }
            const delivery_option = prompt(`Choose delivery option:\n1. Farm Pickup\n2. Batch Delivery (adds GH₵ 50.00)\nType "Farm Pickup" or "Batch Delivery":`, "Farm Pickup");
            if (!delivery_option) return;

            try {
                const res = await fetch(`${API_URL}/api/v1/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ buyer_name, buyer_phone, item_id: itemId, quantity_ordered, delivery_option })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Order failed");

                alert(`🎉 Order Successful!\nGrand Total: ${data.order_summary.grand_total_ghs}\nFulfillment: ${data.order_summary.fulfillment_type}`);
                loadProducts();
            } catch (err) {
                alert(err.message);
            }
        }

        // Initial load
        loadProducts();
    </script>
</body>
</html>
