<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- HEADER -->
    <header class="bg-emerald-900 border-b border-emerald-800 shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">🌱 AgriConnect Marketplace</h1>
                <p class="text-xs text-emerald-400">Direct from local farms to urban buyers. Cutting out middlemen, reducing post-harvest loss.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleView('marketplace')" id="btn-market" class="bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-600 transition">Marketplace</button>
                <button onclick="toggleView('farmer')" id="btn-farmer" class="bg-emerald-800 text-emerald-200 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition border border-emerald-700">🌾 Farmer Portal</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">

        <!-- MARKETPLACE VIEW -->
        <div id="view-marketplace">
            <!-- Categories -->
            <div class="flex flex-wrap items-center gap-3 mb-8">
                <button onclick="filterCategory('All')" class="category-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-medium transition shadow-sm">All Listings</button>
                <button onclick="filterCategory('Vegetables')" class="category-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-700 transition border border-slate-700">Vegetables</button>
                <button onclick="filterCategory('Poultry')" class="category-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-700 transition border border-slate-700">Poultry</button>
                <button onclick="filterCategory('Tubers')" class="category-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-700 transition border border-slate-700">Tubers</button>
            </div>

            <!-- Product Grid -->
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic cards load here -->
            </div>
        </div>

        <!-- FARMER PORTAL VIEW -->
        <div id="view-farmer" class="hidden max-w-xl mx-auto bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl">
            
            <!-- Login State -->
            <div id="farmer-login-box" class="space-y-4">
                <h2 class="text-2xl font-bold text-white mb-2">Farmer Sign In</h2>
                <p class="text-sm text-slate-400 mb-4">Log in to manage your inventory or post new harvest live.</p>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Email Address</label>
                    <input type="email" id="login-email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white outline-none focus:border-emerald-500" placeholder="farmer@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white outline-none focus:border-emerald-500" placeholder="••••••••">
                </div>
                <button onclick="loginFarmer()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl hover:bg-emerald-500 transition shadow-lg shadow-emerald-900/40">Access Dashboard</button>
                <p id="login-err" class="text-rose-400 text-sm text-center font-medium"></p>
            </div>

            <!-- Dashboard State (Hidden until login) -->
            <div id="farmer-dashboard-box" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-slate-900/60 p-4 rounded-2xl border border-slate-700">
                    <div>
                        <p class="text-xs text-emerald-400 font-semibold uppercase">Active Farmer Session</p>
                        <p id="farmer-display-name" class="font-bold text-white text-lg"></p>
                    </div>
                    <button onclick="logoutFarmer()" class="text-xs bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-700 font-medium">Log Out</button>
                </div>

                <!-- Add Listing Form -->
                <div class="border-t border-slate-700 pt-6">
                    <h3 class="font-bold text-lg text-white mb-4">Post New Harvest Listing</h3>
                    <div class="space-y-3">
                        <input type="text" id="new-name" placeholder="Product Name (e.g. Fresh Tomatoes)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-emerald-500">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="new-category" placeholder="Category (e.g. Vegetables)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-emerald-500">
                            <input type="text" id="new-unit" placeholder="Unit (e.g. Crate, Bag)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-emerald-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="new-price" placeholder="Price per unit (GH₵)" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-emerald-500">
                            <input type="number" id="new-qty" placeholder="Quantity Available" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-emerald-500">
                        </div>
                        <button onclick="postProduct()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-emerald-500 transition shadow-md">Publish Live to Marketplace</button>
                    </div>
                </div>

                <!-- My Listings Management -->
                <div class="border-t border-slate-700 pt-6">
                    <h3 class="font-bold text-lg text-white mb-3">Your Live Inventory</h3>
                    <div id="my-listings-list" class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- SCRIPT LOGIC -->
    <script>
        const API_URL = "https://agri-connect-api-2.onrender.com";
        let currentCategory = "All";
        let farmerToken = localStorage.getItem("farmer_token") || "";

        // Initialize on load
        loadProducts();
        if (farmerToken) {
            showDashboardState();
        }

        function toggleView(view) {
            if (view === 'marketplace') {
                document.getElementById('view-marketplace').classList.remove('hidden');
                document.getElementById('view-farmer').classList.add('hidden');
                document.getElementById('btn-market').className = "bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition";
                document.getElementById('btn-farmer').className = "bg-emerald-800 text-emerald-200 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition border border-emerald-700";
                loadProducts();
            } else {
                document.getElementById('view-marketplace').classList.add('hidden');
                document.getElementById('view-farmer').classList.remove('hidden');
                document.getElementById('btn-farmer').className = "bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition";
                document.getElementById('btn-market').className = "bg-emerald-800 text-emerald-200 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition border border-emerald-700";
                if (farmerToken) loadMyListings();
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText.includes(cat) || (cat === 'All' && btn.innerText.includes('All'))) {
                    btn.className = "category-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-medium transition shadow-sm";
                } else {
                    btn.className = "category-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-700 transition border border-slate-700";
                }
            });
            loadProducts();
        }

        async function loadProducts() {
            let url = `${API_URL}/api/v1/products`;
            if (currentCategory !== 'All') url += `?category=${currentCategory}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12">No active harvest listings found in this category.</p>`;
                    return;
                }

                data.results.forEach(item => {
                    grid.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:border-slate-600 transition">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full">${item.category}</span>
                                    <span class="text-xs text-slate-400 font-medium">📍 ${item.region}</span>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-1">${item.product_name}</h3>
                                <p class="text-xs text-slate-400 mb-4">Farmer: <span class="font-semibold text-slate-200">${item.farmer_name}</span></p>
                            </div>
                            <div>
                                <div class="flex justify-between items-baseline mb-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                                    <span class="text-2xl font-extrabold text-emerald-400">GH₵ ${parseFloat(item.price_ghs).toFixed(2)}</span>
                                    <span class="text-xs text-slate-300 font-medium">${item.quantity_available} ${item.unit}s left</span>
                                </div>
                                <button onclick="openOrderPrompt(${item.id}, '${item.product_name}', ${item.quantity_available}, '${item.unit}')" class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-xl hover:bg-emerald-500 transition shadow-md">Place Order</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        async function loginFarmer() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-err');
            errEl.innerText = "";

            try {
                const res = await fetch(`${API_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Authentication failed");

                farmerToken = data.access_token;
                localStorage.setItem("farmer_token", farmerToken);
                showDashboardState();
            } catch (err) {
                errEl.innerText = err.message;
            }
        }

        function showDashboardState() {
            document.getElementById('farmer-login-box').classList.add('hidden');
            document.getElementById('farmer-dashboard-box').classList.remove('hidden');
            loadMyListings();
        }

        function logoutFarmer() {
            farmerToken = "";
            localStorage.removeItem("farmer_token");
            document.getElementById('farmer-dashboard-box').classList.add('hidden');
            document.getElementById('farmer-login-box').classList.remove('hidden');
        }

        async function loadMyListings() {
            try {
                const res = await fetch(`${API_URL}/api/v1/farmer/my-listings`, {
                    headers: { 'Authorization': `Bearer ${farmerToken}` }
                });
                const data = await res.json();
                document.getElementById('farmer-display-name').innerText = data.farmer || "Verified Farmer Partner";
                
                const container = document.getElementById('my-listings-list');
                container.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400">You currently have no active listings.</p>`;
                    return;
                }

                data.results.forEach(item => {
                    container.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                            <div>
                                <p class="font-bold text-white">${item.product_name}</p>
                                <p class="text-xs text-slate-400">GH₵ ${item.price_ghs} • ${item.quantity_available} ${item.unit}s</p>
                            </div>
                            <button onclick="deleteListing(${item.id})" class="text-rose-400 hover:text-rose-300 text-xs font-semibold px-2.5 py-1 bg-rose-950/40 rounded-lg border border-rose-900">Delete</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading farmer listings:", err);
            }
        }

        async function postProduct() {
            const product_name = document.getElementById('new-name').value;
            const category = document.getElementById('new-category').value;
            const unit = document.getElementById('new-unit').value;
            const price_ghs = parseFloat(document.getElementById('new-price').value);
            const quantity_available = parseInt(document.getElementById('new-qty').value);

            if (!product_name || !category || !unit || isNaN(price_ghs) || isNaN(quantity_available)) {
                alert("Please fill out all product fields correctly.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/v1/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${farmerToken}`
                    },
                    body: JSON.stringify({ product_name, category, unit, price_ghs, quantity_available })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Failed to post listing");

                alert("Harvest successfully published live!");
                document.getElementById('new-name').value = '';
                document.getElementById('new-category').value = '';
                document.getElementById('new-unit').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-qty').value = '';
                loadMyListings();
            } catch (err) {
                alert(err.message);
            }
        }

        async function deleteListing(id) {
            if (!confirm("Are you sure you want to remove this harvest listing?")) return;

            try {
                const res = await fetch(`${API_URL}/api/v1/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${farmerToken}` }
                });
                if (!res.ok) throw new Error("Failed to delete item");
                loadMyListings();
            } catch (err) {
                alert(err.message);
            }
        }

        async function openOrderPrompt(itemId, productName, maxStock, unit) {
            const buyer_name = prompt(`Enter your name for ordering ${product_name}:`);
            if (!buyer_name) return;
            const buyer_phone = prompt(`Enter your contact phone number (e.g. 024XXXXXXX):`);
            if (!buyer_phone) return;
            const qtyStr = prompt(`Enter quantity needed (Available: ${maxStock} ${unit}s):`);
            const quantity_ordered = parseInt(qtyStr);
            if (isNaN(quantity_ordered) || quantity_ordered <= 0) {
                alert("Invalid quantity entered.");
                return;
            }
            const delivery_option = prompt(`Select fulfillment option:\n1. Farm Pickup\n2. Batch Delivery (adds GH₵ 50.00)\nType "Farm Pickup" or "Batch Delivery":`, "Farm Pickup");
            if (!delivery_option) return;

            try {
                const res = await fetch(`${API_URL}/api/v1/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ buyer_name, buyer_phone, item_id: itemId, quantity_ordered, delivery_option })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Order processing failed");

                alert(`🎉 Order Confirmed!\nGrand Total: ${data.order_summary.grand_total_ghs}\nFulfillment: ${data.order_summary.fulfillment_type}`);
                loadProducts();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
